# Wi-Fi filament scale: ESP32 + HX711 + 5 kg bar load cell, running ESPHome.
# Wiring, flashing and calibration steps: see "Wi-Fi scale" in the README.
#
# The inventory server reads   GET  http://<scale>/sensor/Spool Weight
# and zeroes it with           POST http://<scale>/button/Tare/press

substitutions:
  name: filament-scale
  friendly_name: Filament Scale
  hx711_dout: GPIO16   # HX711 DT / DOUT
  hx711_sck: GPIO17    # HX711 SCK / CLK

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev      # ESP32-WROOM-32 "DevKit V1" boards

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:                  # if Wi-Fi fails, the scale opens this hotspot to set Wi-Fi again
    ssid: "Filament Scale Setup"
    password: !secret fallback_password

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

web_server:            # the page at http://<scale>/ and the REST API the inventory uses
  port: 80
  version: 3

globals:
  - id: tare_raw       # raw reading with nothing on the scale
    type: float
    restore_value: true
    initial_value: "0"
  - id: counts_per_gram  # set by the Calibrate button
    type: float
    restore_value: true
    initial_value: "400"

sensor:
  - platform: hx711
    id: raw
    name: "Raw"
    dout_pin: ${hx711_dout}
    clk_pin: ${hx711_sck}
    gain: 128
    update_interval: 0.2s
    accuracy_decimals: 0
    entity_category: diagnostic
    filters:
      - median:
          window_size: 5
          send_every: 1

  - platform: template
    id: weight
    name: "Spool Weight"
    unit_of_measurement: g
    device_class: weight
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 0.5s
    lambda: |-
      if (isnan(id(raw).state) || id(counts_per_gram) == 0) return NAN;
      return (id(raw).state - id(tare_raw)) / id(counts_per_gram);
    filters:
      - sliding_window_moving_average:
          window_size: 4
          send_every: 1

number:
  - platform: template
    id: cal_weight
    name: "Calibration Weight"
    unit_of_measurement: g
    min_value: 50
    max_value: 5000
    step: 1
    initial_value: 1000
    optimistic: true
    restore_value: true
    mode: box

button:
  - platform: template
    name: "Tare"
    on_press:
      - lambda: id(tare_raw) = id(raw).state;

  - platform: template
    name: "Calibrate"   # put exactly "Calibration Weight" grams on the scale, then press
    on_press:
      - lambda: |-
          float delta = id(raw).state - id(tare_raw);
          if (fabsf(delta) > 100) {
            id(counts_per_gram) = delta / id(cal_weight).state;
            ESP_LOGI("scale", "Calibrated: %.2f counts per gram", id(counts_per_gram));
          } else {
            ESP_LOGW("scale", "Calibration skipped: put the calibration weight on the scale first");
          }

  - platform: restart
    name: "Restart"
